name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/tracegif/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install -r skills/tracegif/requirements.txt
      - name: Install browser and Linux system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install browser
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Validate skill package
        run: python tools/validate_skill.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Create sample project
        run: python skills/tracegif/scripts/tracegif.py prepare examples/source/typebit-mark.svg --project build/example
      - name: Configure playback speed
        run: python skills/tracegif/scripts/tracegif.py configure build/example --speed 1.5
      - name: Render portable HTML
        run: python skills/tracegif/scripts/tracegif.py render build/example
      - name: Verify actual offline browser behavior
        run: python skills/tracegif/scripts/tracegif.py verify build/example/animation.html
      - name: Export transparent PNG
        run: python skills/tracegif/scripts/tracegif.py export build/example --format png --width 480
      - name: Export animated GIF
        run: python skills/tracegif/scripts/tracegif.py export build/example --format gif --width 480 --fps 8
      - name: Package editable source
        run: python skills/tracegif/scripts/tracegif.py package build/example
      - name: Build verified public cases
        if: runner.os == 'Linux'
        run: python tools/build_cases.py --build-root build/cases --media-root build/cases/media
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/example/verification/
            build/example/animation.html
            build/example/exports/
            build/example-project.zip
            build/cases/
          if-no-files-found: warn
          retention-days: 14

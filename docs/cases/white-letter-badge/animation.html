<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="TraceGIF 0.4.0"><title>White Letter Badge</title><style>/* TraceGIF 0.4.0 — MIT. Backgrounds are deliberately transparent. */
:root {
  color-scheme: light;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
}

#typebit-stage {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: grid;
  place-items: center;
  background: transparent;
}

#typebit-scene {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  isolation: isolate;
}

#typebit-art,
#typebit-traces,
#typebit-doodle {
  pointer-events: none;
}

/* Prevent a flash of the completed artwork before the inline player runs. */
#typebit-art,
#typebit-traces,
#typebit-doodle { opacity: 0; }

#typebit-controls {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: auto auto auto minmax(80px, 1fr) auto auto auto auto;
  gap: 8px;
  align-items: center;
  width: min(900px, calc(100vw - 24px));
  max-height: calc(100dvh - max(16px, env(safe-area-inset-bottom)) - 8px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px;
  border: 1px solid rgba(15, 23, 42, 0.16);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.95);
  color: #172033;
  font: 500 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.01em;
  box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12);
}

#typebit-controls button,
#typebit-controls select,
body > #typebit-control {
  min-height: 38px;
  min-width: 0;
  border: 1px solid #d6dce5;
  border-radius: 9px;
  padding: 7px 10px;
  background: white;
  color: #172033;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#typebit-control { min-width: 80px; font-weight: 650; }
#typebit-controls > label { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
#typebit-controls select { min-width: 68px; padding-right: 4px; }
#typebit-progress { width: 100%; min-width: 0; margin: 0; accent-color: #475569; cursor: pointer; }
#typebit-time { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
#typebit-export-status { grid-column: 1 / -1; color: #475569; font-size: 12px; overflow-wrap: anywhere; }
#typebit-export-status:empty { display: none; }
#typebit-cancel-export { grid-column: 1 / -1; justify-self: start; }
#typebit-cancel-export[hidden] { display: none; }
#typebit-gif-options { grid-column: 1 / -1; min-width: 0; border-top: 1px solid #e2e8f0; padding-top: 7px; }
#typebit-gif-options summary { cursor: pointer; width: fit-content; padding: 2px 0; color: #475569; }
.typebit-gif-fields { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding-top: 8px; }
.typebit-gif-fields label { display: flex; flex-direction: column; align-items: start; gap: 4px; min-width: 0; }
.typebit-gif-fields select { width: 100%; max-width: 100%; }
.typebit-gif-fields input[type="color"] { width: 100%; height: 38px; padding: 4px; border: 1px solid #d6dce5; border-radius: 9px; background: white; cursor: pointer; }
.typebit-gif-fields p, #typebit-gif-estimate { grid-column: 1 / -1; margin: 0; color: #475569; font-size: 12px; overflow-wrap: anywhere; }
#typebit-gif-estimate[data-error="true"] { color: #9f1239; }
#typebit-controls button:hover,
body > #typebit-control:hover { background: #f1f5f9; }
#typebit-controls button:active { background: #e2e8f0; }
#typebit-controls button:disabled { cursor: progress; opacity: .6; }
#typebit-controls :focus-visible,
body > #typebit-control:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
#typebit-controls[hidden], #typebit-control[hidden] { display: none; }

/* Retain the basic control when an older document uses the current player. */
body > #typebit-control { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); font: 600 14px/1.4 system-ui, sans-serif; }

@media (max-width: 980px) {
  #typebit-controls { grid-template-columns: auto auto minmax(0, 1fr) auto auto auto; }
  #typebit-control { grid-column: 1; grid-row: 1; }
  #typebit-replay { grid-column: 2; grid-row: 1; }
  #typebit-controls > label { grid-column: 3; grid-row: 1; justify-content: center; }
  #typebit-download-html { grid-column: 4; grid-row: 1; }
  #typebit-download-png { grid-column: 5; grid-row: 1; }
  #typebit-download-gif { grid-column: 6; grid-row: 1; }
  #typebit-progress { grid-column: 1 / 5; grid-row: 2; }
  #typebit-time { grid-column: 5 / 7; grid-row: 2; }
}

@media (max-width: 700px) {
  #typebit-controls { grid-template-columns: auto auto minmax(0, 1fr); }
  #typebit-controls > label { justify-content: end; }
  #typebit-progress { grid-column: 1 / 3; }
  #typebit-time { grid-column: 3; }
  #typebit-download-html { grid-column: 1; grid-row: 3; }
  #typebit-download-png { grid-column: 2; grid-row: 3; }
  #typebit-download-gif { grid-column: 3; grid-row: 3; justify-self: end; }
}

@media (max-width: 360px) {
  #typebit-controls > label { font-size: 0; gap: 0; }
  #typebit-controls select { font-size: 13px; }
  .typebit-gif-fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .typebit-gif-fields label:first-child { grid-column: 1 / -1; }
}

@media print {
  #typebit-controls, #typebit-control { display: none; }
}

    const width = selectedWidth === "auto" ? Math.max(1, Math.min(480, Math.ceil(viewBox.width))) : Number(selectedWidth);
    const fps = gifFpsControl ? Number(gifFpsControl.value) : 10;
    const background = gifBackgroundControl ? gifBackgroundControl.value : "#ffffff";
    if (!Number.isInteger(width) || width < 1 || width > 1920 || !Number.isInteger(fps) || fps < 1 || fps > 30 || !/^#[0-9a-f]{6}$/i.test(background)) {
      throw new Error("Choose a GIF width from 1 to 1920 pixels, 1–30 frames per second, and a solid background color.");
    }
    const height = Math.max(1, Math.round(width * viewBox.height / viewBox.width));
    const steps = Math.max(1, Math.ceil(duration / playbackRate * fps));
    if (steps + 1 > 600 || width * height * (steps + 1) > 100000000 || height > 4096) {
      throw new Error("GIF exceeds 600 frames or 100 million frame pixels (maximum height 4096). Reduce width or frames per second, increase playback speed, or ask your Agent for a smaller GIF.");
    }
    return {width, height, fps, background, steps};
  }

  function updateGifEstimate() {
    if (!gifEstimate) return;
    try {
      const {width, height, fps} = gifSettings();
      gifEstimate.textContent = `${width} × ${height} px · ${fps} fps · ${(duration / playbackRate + 0.8).toFixed(1)} seconds including the final hold`;
      gifEstimate.dataset.error = "false";
    } catch (error) {
      gifEstimate.textContent = error.message;
      gifEstimate.dataset.error = "true";
    }
  }

  async function downloadGif() {
    const encoder = window.gifenc;
    if (!encoder || typeof encoder.GIFEncoder !== "function") {
      throw new Error("This HTML is missing its GIF encoder. Ask your Agent to render it again.");
    }
    const rate = playbackRate;
    const {width, height, fps, background, steps} = gifSettings();
    const backgroundLabel = background.toLowerCase() === "#ffffff" ? "white" : background.toUpperCase();
    const saved = getState();
    const focus = document.activeElement;
    const savedScroll = controls ? controls.scrollTop : 0;
    const disabled = Array.from(controls ? controls.querySelectorAll("button,input,select") : [control])
      .map(element => [element, element === gifControl ? false : element.disabled]);
    const oldBusy = controls && controls.getAttribute("aria-busy");
    const job = {cancelled: false};
    cancelFrame();
    time = saved.time;
    status = saved.status === "playing" ? "paused" : saved.status;
    exportJob = job;
    disabled.forEach(([element]) => { element.disabled = true; });
    if (controls) controls.setAttribute("aria-busy", "true");
    if (cancelExportControl) {
      cancelExportControl.hidden = false;
      cancelExportControl.disabled = false;
      cancelExportControl.focus({preventScroll: true});
    }
    const assertActive = () => {
      if (job.cancelled) throw new DOMException("GIF export canceled.", "AbortError");
    };
    try {
      if (exportStatus) exportStatus.textContent = `Exporting GIF… 0% (${backgroundLabel} background)`;
      if (controls) controls.scrollTop = controls.scrollHeight;
      if (document.fonts) await document.fonts.ready;
      assertActive();
      const gif = encoder.GIFEncoder();
      const backgroundRgb = [1, 3, 5].map(offset => Number.parseInt(background.slice(offset, offset + 2), 16));
      // Keep the chosen matte, pure white details and black stable across palettes.
      const fixedColors = [backgroundRgb, [255, 255, 255], [0, 0, 0]];
      for (let index = 0; index <= steps; index++) {
        // Give the browser time to paint progress and accept Cancel between frames.
        await new Promise(resolve => setTimeout(resolve, 0));
        assertActive();
        time = duration * index / steps;
        status = "paused";
        render();
        const canvas = await captureCanvas(width, height, background);
        assertActive();
        const rgba = canvas.getContext("2d").getImageData(0, 0, width, height).data;
        const palette = encoder.quantize(rgba, 253);
        for (const color of fixedColors) {
          if (!palette.some(entry => entry.every((channel, index) => channel === color[index]))) palette.push(color);
        }
        const pixels = encoder.applyPalette(rgba, palette);
        const exactColors = fixedColors.map(color => ({
          rgb: (color[0] << 16) | (color[1] << 8) | color[2],
          index: palette.findIndex(entry => entry.every((channel, index) => channel === color[index]))
        }));
        // The encoder's RGB565 lookup can share a cache bucket with a nearby shade.
        // Correct exact solid colors after palette mapping so white details stay white.
        for (let pixel = 0, offset = 0; pixel < pixels.length; pixel++, offset += 4) {
          const rgb = (rgba[offset] << 16) | (rgba[offset + 1] << 8) | rgba[offset + 2];
          if (rgb === exactColors[0].rgb) pixels[pixel] = exactColors[0].index;
          else if (rgb === exactColors[1].rgb) pixels[pixel] = exactColors[1].index;
          else if (rgb === exactColors[2].rgb) pixels[pixel] = exactColors[2].index;
        }
        const start = Math.round(index * duration / rate / steps * 100) * 10;
        const end = Math.round((index + 1) * duration / rate / steps * 100) * 10;
        gif.writeFrame(pixels, width, height, {palette, delay: index === steps ? 800 : end - start, repeat: 0, dispose: 2});
        if (exportStatus) exportStatus.textContent = `Exporting GIF… ${Math.round((index + 1) / (steps + 1) * 100)}% (${backgroundLabel} background)`;
      }
      assertActive();
      gif.finish();
      downloadBlob(new Blob([gif.bytes()], {type: "image/gif"}), filename("gif"));
      return `GIF saved: ${width} × ${height} px, ${fps} fps at ${rate}×, ${backgroundLabel} background.`;
    } finally {
      exportJob = null;
      disabled.forEach(([element, wasDisabled]) => { element.disabled = wasDisabled; });
      if (cancelExportControl) {
        cancelExportControl.hidden = true;
        cancelExportControl.disabled = false;
      }
      if (controls) {
        if (oldBusy === null) controls.removeAttribute("aria-busy");
        else controls.setAttribute("aria-busy", oldBusy);
      }
      time = saved.time;
      playbackRate = saved.playbackRate;
      status = saved.status === "playing" ? "paused" : saved.status;
      syncSpeedControl();
      render();
      if (saved.status === "playing") play();
      if (controls) controls.scrollTop = savedScroll;
      if (focus instanceof HTMLElement && focus.isConnected && !focus.disabled) focus.focus({preventScroll: true});
    }
  }

  function bindDownload(button, action, message) {
    if (!button) return;
    button.addEventListener("click", async () => {
      if (activeDownload || exportJob) return;
      activeDownload = true;
      button.disabled = true;
      if (exportStatus) exportStatus.textContent = "Preparing download…";
      try {
        const result = await action();
        if (exportStatus) exportStatus.textContent = result || message;
      } catch (error) {
        if (exportStatus) exportStatus.textContent = error.message || "Download failed. Please try again.";
      } finally {
        button.disabled = false;
        activeDownload = false;
      }
    });
  }

  function editableTarget(target) {
    return target instanceof Element && (target.closest("input,textarea,select,[role=textbox]") || target.isContentEditable);
  }

  document.addEventListener("keydown", event => {
    if (exportJob) {
      if (event.key === "Escape") cancelGif();
      if (["Escape", "ArrowRight", " ", "r", "R"].includes(event.key)) event.preventDefault();
      return;
    }
    if (event.defaultPrevented || event.repeat || event.ctrlKey || event.metaKey || event.altKey || editableTarget(event.target)) return;
    if ((event.code === "Space" || event.key === " ") && event.target instanceof Element && event.target.closest("button,summary")) return;
    if (event.key === "ArrowRight") {
      event.preventDefault();
      play();
    } else if (event.code === "Space" || event.key === " ") {
      event.preventDefault();
      if (status === "playing") pause();
      else if (status === "paused") play();
    } else if (event.key.toLowerCase() === "r") {
      event.preventDefault();
      restart();
    }
  });

  control.addEventListener("click", () => status === "playing" ? pause() : play());
  if (replayControl) replayControl.addEventListener("click", restart);
  if (speedControl) speedControl.addEventListener("change", () => setPlaybackRate(Number(speedControl.value)));
  for (const setting of [gifWidthControl, gifFpsControl, gifBackgroundControl]) {
    if (setting) setting.addEventListener("input", updateGifEstimate);
    if (setting) setting.addEventListener("change", updateGifEstimate);
  }
  if (progressControl) progressControl.addEventListener("input", () => seek(Number(progressControl.value)));
  bindDownload(htmlControl, downloadHtml, "HTML saved with the selected speed. It waits for Play.");
  bindDownload(pngControl, downloadPng, "Current frame saved as a transparent PNG.");
  bindDownload(gifControl, downloadGif, "GIF saved with a white background.");
  if (cancelExportControl) cancelExportControl.addEventListener("click", cancelGif);
  window.tracegif = window.typebit = Object.freeze({
    play,
    pause,
    restart,
    seek,
    getState,
    setPlaybackRate,
    setControlsVisible(visible) {
      control.hidden = !visible;
      if (controls) controls.hidden = !visible;
    }
  });
  syncSpeedControl();
  render();
})();
</script></body></html>
